name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  # Ships only a main commit whose push run of ci.yml passed; scheduled runs
  # are left out because they compare recordings, not the release. A queued or
  # running CI fails the gate: re-dispatch when it is green.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo '::error::release only from main'; exit 1; }
          r=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml --commit "$GITHUB_SHA" --event push --branch main -L 1 \
            --json status,conclusion -q '.[] | "\(.status)/\(.conclusion)"')
          [ "$r" = completed/success ] || { echo "::error::CI on $GITHUB_SHA is '${r:-missing}', not completed/success"; exit 1; }

  build-linux:
    needs: gate
    # Pinned so the image that builds the shipped library changes only on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Installs the version rust-toolchain.toml names.
      - run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: linux

      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Stage artifact
        run: |
          mkdir -p staging
          cp target/x86_64-unknown-linux-gnu/release/libgodot_vim.so staging/
          sha256sum staging/libgodot_vim.so | awk '{print $1 "  libgodot_vim.so"}' > staging/libgodot_vim.so.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: libgodot_vim.so
          path: staging/*

  build-windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: windows

      - run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          cp target/x86_64-pc-windows-msvc/release/godot_vim.dll staging/
          sha256sum staging/godot_vim.dll | awk '{print $1 "  godot_vim.dll"}' > staging/godot_vim.dll.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: godot_vim.dll
          path: staging/*

  build-macos:
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: macos

      - name: Build ARM64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/libgodot_vim.dylib \
            target/x86_64-apple-darwin/release/libgodot_vim.dylib \
            -output libgodot_vim.dylib

      - name: Stage artifact
        run: |
          mkdir -p staging
          cp libgodot_vim.dylib staging/
          shasum -a 256 staging/libgodot_vim.dylib > staging/libgodot_vim.dylib.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: libgodot_vim.dylib
          path: staging/*

  build-android:
    needs: gate
    runs-on: ubuntu-24.04
    env:
      # Godot's platform/android/java/app/config.gradle (NDK) and minSdk.
      NDK_VERSION: "29.0.14206865"
      ANDROID_API: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: android

      # By path, not ANDROID_NDK_HOME: the image's default NDK can change,
      # and one older than r28 links with 4 KB pages.
      - name: Locate NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          fi
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android${ANDROID_API}-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android${ANDROID_API}-clang"
            echo "READELF=$BIN/llvm-readelf"
          } >> "$GITHUB_ENV"

      - run: cargo build --release --locked --target aarch64-linux-android

      - run: cargo build --release --locked --target x86_64-linux-android

      - name: Stage and check
        run: |
          mkdir -p staging
          cp target/aarch64-linux-android/release/libgodot_vim.so staging/libgodot_vim.android.arm64.so
          cp target/x86_64-linux-android/release/libgodot_vim.so staging/libgodot_vim.android.x86_64.so
          ./scripts/check-android-lib.sh staging/*.so
          for f in staging/*.so; do
            n=$(basename "$f")
            sha256sum "$f" | awk -v n="$n" '{print $1 "  " n}' > "staging/$n.sha256"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: libgodot_vim.android
          path: staging/*

  release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble addon
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # One script owns the addon layout; a person building from source
          # runs the same one (docs/BUILDING.md), so CI and a laptop cannot
          # drift. It also refuses to produce a tree with anything beside
          # addons/, which is what would pollute a user's project root.
          ./scripts/assemble-addon.sh \
            --lib artifacts/libgodot_vim.so \
            --lib artifacts/godot_vim.dll \
            --lib artifacts/libgodot_vim.dylib \
            --lib artifacts/libgodot_vim.android.arm64.so \
            --lib artifacts/libgodot_vim.android.x86_64.so \
            --version "$VERSION" \
            --out .
          # Later steps (VirusTotal, attestation, SBOM) read the binaries from
          # addons/godot_vim/bin/, so mirror the assembled tree there too.
          rm -rf addons/godot_vim/bin
          cp -r "godot-vim-$VERSION/addons/godot_vim/bin" addons/godot_vim/bin

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2  # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            addons/godot_vim/bin/libgodot_vim.so
            addons/godot_vim/bin/godot_vim.dll
            addons/godot_vim/bin/libgodot_vim.dylib
            addons/godot_vim/bin/libgodot_vim.android.arm64.so
            addons/godot_vim/bin/libgodot_vim.android.x86_64.so

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'addons/godot_vim/bin/*'

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --override-filename godot-vim-sbom.cdx

      - name: Generate release body
        id: body
        env:
          VERSION: ${{ inputs.version }}
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          set -eu

          PREV_TAG=$(git tag --list "v*" --sort=-version:refname | grep -vFx "$VERSION" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          {
            echo 'RELEASE_BODY<<BODYEOF'

            if [ -n "${VT_ANALYSIS:-}" ]; then
              echo "## VirusTotal Scan"
              echo ""
              IFS=',' read -ra ENTRIES <<< "$VT_ANALYSIS"
              for entry in "${ENTRIES[@]}"; do
                filename="${entry%%=*}"
                url="${entry#*=}"
                echo "- [\`${filename}\`](${url})"
              done
              echo ""
            fi

            echo "**Full Changelog**: https://github.com/hmdfrds/godot-vim/compare/${PREV_TAG}...${VERSION}"
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create addon zip
        env:
          VERSION: ${{ inputs.version }}
        run: zip -r "godot-vim-${VERSION}.zip" "godot-vim-${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          tag_name: ${{ inputs.version }}
          # Tag the gated, built commit, not main at publish time.
          target_commitish: ${{ github.sha }}
          name: GodotVim ${{ inputs.version }}
          body: ${{ steps.body.outputs.RELEASE_BODY }}
          files: |
            godot-vim-${{ inputs.version }}.zip
            addons/godot_vim/bin/libgodot_vim.so
            addons/godot_vim/bin/godot_vim.dll
            addons/godot_vim/bin/libgodot_vim.dylib
            addons/godot_vim/bin/libgodot_vim.android.arm64.so
            addons/godot_vim/bin/libgodot_vim.android.x86_64.so
            artifacts/libgodot_vim.so.sha256
            artifacts/godot_vim.dll.sha256
            artifacts/libgodot_vim.dylib.sha256
            artifacts/libgodot_vim.android.arm64.so.sha256
            artifacts/libgodot_vim.android.x86_64.so.sha256
            godot-vim-sbom.cdx.json
