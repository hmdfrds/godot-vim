name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `-D warnings` here covers rustc only. It is deliberately NOT global:
      # promoting clippy lints to errors would defeat the counting step below,
      # which is what actually holds the line on pre-existing debt.
      - name: Test
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --all-targets --locked

      # Deliberately NOT `-D warnings` for the whole crate: four pre-existing
      # lint sites predate this workflow and are tracked separately. What must
      # not regress is the count, so the step fails only if a NEW site appears.
      - name: Clippy (no new lint sites)
        shell: bash
        run: |
          cargo clippy --all-targets --message-format=short 2>&1 \
            | grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: warning' \
            | sed 's/: warning.*//' | sort -u > /tmp/lints.txt || true
          echo "lint sites:"; cat /tmp/lints.txt
          count=$(wc -l < /tmp/lints.txt)
          if [ "$count" -gt 4 ]; then
            echo "::error::clippy lint sites rose to $count (baseline 4)"
            exit 1
          fi

      - name: Rustfmt
        run: cargo fmt --all --check

  godot-smoke:
    name: load in Godot 4.5
    # Same image as release.yml's Linux build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_RELEASE: 4.5-stable
      GODOT_ASSET: Godot_v4.5-stable_linux.x86_64
      # From the release's SHA512-SUMS.txt; pinned so a replaced asset fails.
      GODOT_SHA512: b5bd5d8a4dd3f44de1d123361beabaafa4825dd05b5e20fd2bfa540f32594f81d82e7c4e86fae420f4faee77d9def573b570f8b156e9c84a4dc2d5123d09e852
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Download Godot
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/$GODOT_ASSET.zip"
          echo "$GODOT_SHA512  $RUNNER_TEMP/godot.zip" | sha512sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"

      - name: Smoke test
        run: ./scripts/godot-smoke.sh --godot "$RUNNER_TEMP/godot/$GODOT_ASSET"
