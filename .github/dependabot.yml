# Automated dependency updates.
version: 2
updates:
  # Monthly and grouped: one PR per ecosystem a month instead of one per bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # vim-core exports compact_str 0.7 types across its public API, so this
      # crate must match. Bumping it produces 28 type-mismatch errors; PR #62
      # did exactly that and main did not compile until #67 pinned it back.
      - dependency-name: "compact_str"
      # gdext upgrades change the bridge API surface and are deliberate
      # migration projects on their own branch, never a bot bump.
      - dependency-name: "godot"
      # Our own git dependency, bumped by hand with its tag.
      - dependency-name: "vim-core"
  # The Rust version in rust-toolchain.toml, so a bump arrives as a PR that CI
  # checks, new clippy lints included.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "monthly"
